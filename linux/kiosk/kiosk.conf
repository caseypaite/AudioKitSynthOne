# kiosk.conf
# AudioKit Synth One - Linux port
#
# Sourced by synthone-kiosk as a shell fragment, so it is plain KEY="value".
# Edit here rather than in the systemd unit; `systemctl restart synthone-kiosk`
# picks changes up.

# Audio backend: portaudio | jack
#
# portaudio talks to ALSA directly and needs nothing running beforehand, which
# is what you want on a standalone box. Choose jack only if you are starting a
# JACK server yourself (see the unit's After= if you do).
BACKEND="portaudio"

# Window size. Leave empty to fill the panel at its native resolution; the
# official Raspberry Pi 7" display is 800x480.
GEOMETRY=""

# Which panel to show, and how many. Empty means the GUI decides, which on a
# display below 1000x620 -- the 7" panel included -- means compact chrome and
# one panel at a time.
#
# LAYOUT is single | stacked | side; panels are MAIN ENV PAD FX SEQ TUNE.
#
# Do not force "stacked" or "side" on the 7" panel: at 480px tall each of the
# two panels gets about 116px, against 255px for a single panel. TOP selects
# which panel opens first.
LAYOUT=""
TOP=""
BOTTOM=""

# ALSA MIDI source, as CLIENT:PORT, or "all" to take everything.
MIDI="all"

# Hide the pointer. 1 on a touch panel, 0 if you drive it with a mouse.
HIDE_CURSOR="1"

# Virtual terminal and display for the X server. vt1 is the one the Pi boots
# to; the unit stops getty from fighting over it.
VT="vt1"
DISPLAY_NUM=":0"

# Extra X server arguments. -nocursor keeps the pointer off the panel even
# before the GUI starts.
XSERVER_ARGS="-nolisten tcp -nocursor"

# Anything else to hand to synthone-gui, e.g. EXTRA_ARGS="--user-dir /srv/presets"
EXTRA_ARGS=""
